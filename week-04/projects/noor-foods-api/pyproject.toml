[project]
name = "noor-foods-api"
version = "0.1.0"
description = "An API for Noor Foods products, orders and stock"
readme = "README.md"
authors = [
    { name = "Syed", email = "hnz.syed001@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi[standard]>=0.163.2",
    "psycopg[binary]>=3.3.9",
    "pydantic-settings>=2.16.3",
    "sqlmodel>=0.0.50",
]

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[tool.fastapi]
entrypoint = "noor_foods_api.main:app"

